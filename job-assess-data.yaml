apiVersion: batch/v1
kind: Job
metadata:
  generateName: ${USER}-job-train-${JOB_SUFFIX}
  labels:
    eidf/user: ${USER}
    kueue.x-k8s.io/queue-name: ${QUEUE_NAME}
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  completions: 1
  parallelism: 1
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 864000
  ttlSecondsAfterFinished: 2592000
  template:
    metadata:
      labels:
        eidf/user: ${USER}
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # - NVIDIA-H200
                      - NVIDIA-A100-SXM4-80GB
      tolerations:
        - key: "eidf098"
          operator: "Equal"
          value: "True"
          effect: "NoSchedule"
        - key: "eidf107"
          operator: "Equal"
          value: "True"
          effect: "NoSchedule"
      containers:
        - name: pytorch-cuda11-7
          image: pytorch/pytorch:2.0.1-cuda11.7-cudnn8-devel
          workingDir: "/workspace/HealthGPT"
          env:
            # --- START ADDITION ---
            - name: TZ
              value: "Etc/UTC"
            # --- END ADDITION ---
            - name: DEBIAN_FRONTEND # Keep this one too!
              value: "noninteractive"
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: MAX_DELTA
              value: "${MAX_DELTA}"
            - name: NCCL_IB_HCA
              value: "^mlx5"
            - name: PYTHONPATH
              value: "/workspace/HealthGPT"
          command: ["/bin/bash", "-c"]
          args:
            - |

              set -e # Exit immediately if a command exits with a non-zero status.
              set -x # Print commands and their arguments as they are executed.

              # Run apt update and install with -y and noninteractive frontend
              apt update && apt install -y --no-install-recommends \
                  wget \
                  git \
                  unzip \
                  zip \
                  libgl1 \
                  libglib2.0-0 \
                  ffmpeg \
                  tzdata \
                  cmake
              
              apt install -y --no-install-recommends git-all
              
              echo "Copying project files to writable PVC..."
              # Ensure target directory exists in PVC if necessary
              mkdir -p /pvc/HealthGPT
              cp -r /workspace/HealthGPT/* /pvc/HealthGPT/
              cd /pvc/HealthGPT

              # Clean up apt cache
              rm -rf /var/lib/apt/lists/*

              echo "Setting up Python environment..."
              python3 -m pip install --upgrade pip setuptools wheel
              echo "Installing environment dependencies..."
              pip install wavedrom
              python3 -m pip install --user lit
              # pip install xtermcolor
              # pip install termcolor
              pip install pandas

              export PYTHONPATH=$PYTHONPATH:/pvc/HealthGPT/ # Corrected path
              pip install --upgrade pip # Often good practice before installs
              pip install -r requirements.txt

              echo "Logging in to Hugging Face..."
              chmod 600 /pvc/hf_token.txt
              chmod +x hf-login.sh
              ./hf-login.sh

              echo "Running Assessment!!!"
              cd llava/demo/
              chmod +x assess_data_quality.sh
              ./assess_data_quality.sh > log_assess_data_quality_shard_3.txt 2>&1


          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "64Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: writeable
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          nfs:
            server: 10.24.6.77
            path: /user/s2198939-eidf107
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: writeable
          persistentVolumeClaim:
            claimName: mimic-cxr2